services:
  db:
    image: postgres:16-alpine
    container_name: docnow-db
    environment:
      POSTGRES_USER: docnow
      POSTGRES_PASSWORD: labonly_password
      POSTGRES_DB: docnow
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [lab_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docnow -d docnow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: docnow-api
    environment:
      DB_HOST: db
      DB_USER: docnow
      DB_PASSWORD: labonly_password
      DB_NAME: docnow
    depends_on:
      db:
        condition: service_healthy
    networks: [lab_internal]

  proxy:
    image: nginx:1.27-alpine
    container_name: docnow-proxy
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [lab_internal, edge]

networks:
  lab_internal:
    internal: true
  edge:
    driver: bridge

volumes:
  db_data:
